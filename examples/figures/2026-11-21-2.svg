<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 173"><title>单条命令的权限请求：执行框架按用户设置裁决</title><desc>沿用默认：使用当前轮次的沙箱配置；申请额外权限：获准后扩大访问范围，但仍在沙箱内运行；申请沙箱外执行：获准后在沙箱外运行，不只是放宽某条规则。单条命令的权限请求：执行框架按用户设置裁决</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">沿用默认</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">使用当前轮次的沙箱配置</text><line x1="5" y1="61" x2="315" y2="61" stroke="#aab9b2" /><text x="4" y="81" text-anchor="start" font-weight="400" fill="#24332f">申请额外权限</text><text x="128" y="81" text-anchor="start" font-weight="400" fill="#24332f">获准后扩大访问范围，但</text><text x="128" y="101" text-anchor="start" font-weight="400" fill="#24332f">仍在沙箱内运行</text><line x1="5" y1="113" x2="315" y2="113" stroke="#aab9b2" /><text x="4" y="133" text-anchor="start" font-weight="400" fill="#24332f">申请沙箱外执行</text><text x="128" y="133" text-anchor="start" font-weight="400" fill="#24332f">获准后在沙箱外运行，不</text><text x="128" y="153" text-anchor="start" font-weight="400" fill="#24332f">只是放宽某条规则</text><line x1="5" y1="165" x2="315" y2="165" stroke="#aab9b2" /></svg>