<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 161"><title>24 次拉曼拟合尝试：首条回复是否标记完成</title><desc>首条回复就标记完成（19 次）：7/19 次通过；11/19 次未生成结果文件；1/19 次未通过拟合检查；首条回复未标记完成（5 次）：4/5 次通过；1/5 次未通过拟合检查。24 次拉曼拟合尝试：首条回复是否标记完成</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">首条回复就标记</text><text x="4" y="69" text-anchor="start" font-weight="400" fill="#24332f">完成（19 次）</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">7/19 次通过；11/19 次未</text><text x="128" y="69" text-anchor="start" font-weight="400" fill="#24332f">生成结果文件；1/19 次未</text><text x="128" y="89" text-anchor="start" font-weight="400" fill="#24332f">通过拟合检查</text><line x1="5" y1="101" x2="315" y2="101" stroke="#aab9b2" /><text x="4" y="121" text-anchor="start" font-weight="400" fill="#24332f">首条回复未标记</text><text x="4" y="141" text-anchor="start" font-weight="400" fill="#24332f">完成（5 次）</text><text x="128" y="121" text-anchor="start" font-weight="400" fill="#24332f">4/5 次通过；1/5 次未通</text><text x="128" y="141" text-anchor="start" font-weight="400" fill="#24332f">过拟合检查</text><line x1="5" y1="153" x2="315" y2="153" stroke="#aab9b2" /></svg>