<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 161"><title>评估设计取决于你想回答的问题</title><desc>想知道模型怎么答：用观察性设计比较表现；分数不同不说明原因。；想知道改动有没有用：用同一模型做对照；一次只改变一个变量，例如是否启用某条系统提示。。评估设计取决于你想回答的问题</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">想知道模型怎么</text><text x="4" y="69" text-anchor="start" font-weight="400" fill="#24332f">答</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">用观察性设计比较表现；</text><text x="128" y="69" text-anchor="start" font-weight="400" fill="#24332f">分数不同不说明原因。</text><line x1="5" y1="81" x2="315" y2="81" stroke="#aab9b2" /><text x="4" y="101" text-anchor="start" font-weight="400" fill="#24332f">想知道改动有没</text><text x="4" y="121" text-anchor="start" font-weight="400" fill="#24332f">有用</text><text x="128" y="101" text-anchor="start" font-weight="400" fill="#24332f">用同一模型做对照；一次</text><text x="128" y="121" text-anchor="start" font-weight="400" fill="#24332f">只改变一个变量，例如是</text><text x="128" y="141" text-anchor="start" font-weight="400" fill="#24332f">否启用某条系统提示。</text><line x1="5" y1="153" x2="315" y2="153" stroke="#aab9b2" /></svg>