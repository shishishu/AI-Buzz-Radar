<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 153"><title>内部文档问答：25 道题的评分项得分率</title><desc>仅搜索原始文档：53%；仅查维基：最高 48%；搜索原始文档＋查维基：随维基扩充，从 54% 升至 61%。内部文档问答：25 道题的评分项得分率</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">仅搜索原始文档</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">53%</text><line x1="5" y1="61" x2="315" y2="61" stroke="#aab9b2" /><text x="4" y="81" text-anchor="start" font-weight="400" fill="#24332f">仅查维基</text><text x="128" y="81" text-anchor="start" font-weight="400" fill="#24332f">最高 48%</text><line x1="5" y1="93" x2="315" y2="93" stroke="#aab9b2" /><text x="4" y="113" text-anchor="start" font-weight="400" fill="#24332f">搜索原始文档＋</text><text x="4" y="133" text-anchor="start" font-weight="400" fill="#24332f">查维基</text><text x="128" y="113" text-anchor="start" font-weight="400" fill="#24332f">随维基扩充，从 54% 升至</text><text x="128" y="133" text-anchor="start" font-weight="400" fill="#24332f">61%</text><line x1="5" y1="145" x2="315" y2="145" stroke="#aab9b2" /></svg>