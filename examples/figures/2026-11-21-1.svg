<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 245"><title>合并权重怎么选：第 120 步适配器的对照（Terminal-Bench 2.1，每框架 89 题，三框架均值）</title><desc>基础模型：一次通过率 43.3%；每题 49.2 次工具调用；每份更新取 ⅓：一次通过率 49.2%；每题 35.6 次工具调用；每份更新取 ½：一次通过率 52.5%；每题 25.9 次工具调用；每份更新全量相加：一次通过率 50.0%；每题 13.4 次工具调用。合并权重怎么选：第 120 步适配器的对照（Terminal-Bench 2.1，每框架 89 题，三框架均值）</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">基础模型</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">一次通过率 43.3%；每题</text><text x="128" y="69" text-anchor="start" font-weight="400" fill="#24332f">49.2 次工具调用</text><line x1="5" y1="81" x2="315" y2="81" stroke="#aab9b2" /><text x="4" y="101" text-anchor="start" font-weight="400" fill="#24332f">每份更新取 ⅓</text><text x="128" y="101" text-anchor="start" font-weight="400" fill="#24332f">一次通过率 49.2%；每题</text><text x="128" y="121" text-anchor="start" font-weight="400" fill="#24332f">35.6 次工具调用</text><line x1="5" y1="133" x2="315" y2="133" stroke="#aab9b2" /><text x="4" y="153" text-anchor="start" font-weight="400" fill="#24332f">每份更新取 ½</text><text x="128" y="153" text-anchor="start" font-weight="400" fill="#24332f">一次通过率 52.5%；每题</text><text x="128" y="173" text-anchor="start" font-weight="400" fill="#24332f">25.9 次工具调用</text><line x1="5" y1="185" x2="315" y2="185" stroke="#aab9b2" /><text x="4" y="205" text-anchor="start" font-weight="400" fill="#24332f">每份更新全量相</text><text x="4" y="225" text-anchor="start" font-weight="400" fill="#24332f">加</text><text x="128" y="205" text-anchor="start" font-weight="400" fill="#24332f">一次通过率 50.0%；每题</text><text x="128" y="225" text-anchor="start" font-weight="400" fill="#24332f">13.4 次工具调用</text><line x