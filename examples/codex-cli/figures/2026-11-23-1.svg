<svg xmlns="http://www.w3.org/2000/svg" class="edition-plot" role="img" font-family="system-ui, sans-serif" font-size="15" viewBox="0 0 320 245"><title>一次智能体评测如何留下证据</title><desc>任务与环境：任务提供指令，模型和工具在固定环境中运行；重复尝试：评测框架对每道任务发起多次独立运行；结果评分：每次运行结束后，评分器检查环境的最终状态；证据留存：每次运行保留轨迹，与分数一起供复核。一次智能体评测如何留下证据</desc><text x="4" y="19" text-anchor="start" font-weight="600" fill="#24332f">对照项</text><text x="128" y="19" text-anchor="start" font-weight="600" fill="#24332f">观察结果</text><line x1="5" y1="27" x2="315" y2="27" stroke="#aab9b2" /><text x="4" y="49" text-anchor="start" font-weight="400" fill="#24332f">任务与环境</text><text x="128" y="49" text-anchor="start" font-weight="400" fill="#24332f">任务提供指令，模型和工</text><text x="128" y="69" text-anchor="start" font-weight="400" fill="#24332f">具在固定环境中运行</text><line x1="5" y1="81" x2="315" y2="81" stroke="#aab9b2" /><text x="4" y="101" text-anchor="start" font-weight="400" fill="#24332f">重复尝试</text><text x="128" y="101" text-anchor="start" font-weight="400" fill="#24332f">评测框架对每道任务发起</text><text x="128" y="121" text-anchor="start" font-weight="400" fill="#24332f">多次独立运行</text><line x1="5" y1="133" x2="315" y2="133" stroke="#aab9b2" /><text x="4" y="153" text-anchor="start" font-weight="400" fill="#24332f">结果评分</text><text x="128" y="153" text-anchor="start" font-weight="400" fill="#24332f">每次运行结束后，评分器</text><text x="128" y="173" text-anchor="start" font-weight="400" fill="#24332f">检查环境的最终状态</text><line x1="5" y1="185" x2="315" y2="185" stroke="#aab9b2" /><text x="4" y="205" text-anchor="start" font-weight="400" fill="#24332f">证据留存</text><text x="128" y="205" text-anchor="start" font-weight="400" fill="#24332f">每次运行保留轨迹，与分</text><text x="128" y="225" text-anchor="start" font-weight="400" fill="#24332f">数一起供复核</text><line x1="5" y1="237" x2="315" y2="237" stroke="#aab9b2" /></svg>