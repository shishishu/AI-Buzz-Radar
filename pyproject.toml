[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buzz-radar"
version = "0.1.0"
description = "An AI news research agent powered by Codex and the Responses API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<27",
    "openai>=2.30,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "tzdata>=2025.2",
]

[project.scripts]
radar = "ai_buzz_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_buzz_radar = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]
