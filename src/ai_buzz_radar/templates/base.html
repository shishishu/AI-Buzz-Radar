<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product Hunt AI 产品和开发工具发布简报。">
  <title>{% block title %}AI Buzz Radar{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='radar.css') }}">
</head>
<body>
  <a href="#main" class="skip">跳到正文</a>
  <header class="header">
    <div class="container masthead">
      <a href="{{ url_for('brief') }}" class="brand"><span class="brand-mark" aria-hidden="true"></span>AI Buzz Radar</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ url_for('brief') }}"{% if request.endpoint == "brief" %} aria-current="page"{% endif %}>公共简报</a>
        <a href="{{ url_for('research') }}"{% if request.endpoint != "brief" %} aria-current="page"{% endif %}>按需生成</a>
      </nav>
    </div>
  </header>
  <main class="container" id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
