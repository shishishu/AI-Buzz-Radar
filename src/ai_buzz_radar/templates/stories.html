{% macro story_cards(stories) %}
{% for story in stories %}
<article class="story">
  <div class="story-meta">
    <time datetime="{{ story.published_on }}">{{ story.published_on }} 发布</time>
  </div>
  <h2>{{ story.title }}</h2>
  <p>{{ story.summary }}</p>
  <p><strong>为什么重要</strong> {{ story.why_it_matters }}</p>
  {% if story.caveat %}
  <p class="caveat"><strong>仍待验证</strong> {{ story.caveat }}</p>
  {% endif %}
  <div class="evidence">
    <a href="{{ story.launch_url }}" rel="noreferrer external">Product Hunt 发布页 <span aria-hidden="true">↗</span></a>
  </div>
</article>
{% endfor %}
{% endmacro %}
